<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Management</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem("pm-app-settings") || "{}");
        document.documentElement.setAttribute("data-theme", s.theme === "light" ? "light" : "dark");
        document.documentElement.lang = s.locale === "ru" ? "ru" : "en";
      } catch (e) {}
    </script>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      html {
        background: #09090b;
        color-scheme: dark;
      }

      html[data-theme="light"] {
        background: #f8fafc;
        color-scheme: light;
      }

      body {
        background: inherit;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
